<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life Cycles</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --accent: #2ecc71;
            --danger: #e74c3c;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --border-radius: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-main: #e0e0e0;
                --text-sub: #a0a0a0;
                --accent: #27ae60;
                --danger: #c0392b;
                --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin: 30px 0 10px; font-weight: 700; font-size: 24px; }

        #task-list { width: 100%; max-width: 500px; display: grid; gap: 15px; padding-bottom: 80px; }

        .task-card {
            background-color: var(--card-bg);
            padding: 18px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            position: relative;
        }

        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .task-name { font-weight: 600; font-size: 17px; margin: 0; padding-right: 10px; }
        .task-cycle { font-size: 12px; color: var(--text-sub); text-transform: uppercase; white-space: nowrap; }

        .progress-bar-container {
            width: 100%; height: 12px; background-color: rgba(0,0,0,0.05);
            border-radius: 6px; overflow: hidden; margin-bottom: 15px;
        }
        @media (prefers-color-scheme: dark) {
            .progress-bar-container { background-color: rgba(255,255,255,0.05); }
        }

        .progress-bar-fill {
            height: 100%; border-radius: 6px; width: 0%;
            transition: width 0.4s ease-out, background-color 0.4s ease;
        }

        .task-details { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-sub); margin-bottom: 15px; }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn-complete {
            flex: 1; padding: 12px; border: none; background-color: #f0f0f0;
            color: #333; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
        }
        @media (prefers-color-scheme: dark) {
            .btn-complete { background-color: #333; color: #e0e0e0; }
        }

        .btn-delete {
            padding: 12px 16px; border: none; background-color: rgba(231, 76, 60, 0.1);
            color: var(--danger); border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
        }

        .add-btn {
            position: fixed; bottom: calc(30px + env(safe-area-inset-bottom)); right: 20px;
            width: 60px; height: 60px; background-color: var(--accent); color: white;
            border-radius: 30px; font-size: 30px; border: none;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.4); cursor: pointer;
            display: flex; align-items: center; justify-content: center; z-index: 10;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center;
            align-items: center; z-index: 100; padding: 20px;
        }

        .modal { background: var(--card-bg); padding: 25px; border-radius: var(--border-radius); width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--text-sub); }
        
        .interval-inputs {
            display: flex;
            gap: 10px;
        }

        input[type="text"], input[type="number"], input[type="date"], select {
            width: 100%; padding: 12px; border: 1px solid rgba(0,0,0,0.1);
            border-radius: 8px; background: var(--bg-color); color: var(--text-main); font-size: 16px;
        }
        @media (prefers-color-scheme: dark) {
            input[type="text"], input[type="number"], input[type="date"], select { border-color: rgba(255,255,255,0.1); }
        }

        .modal-actions { display: flex; gap: 10px; margin-top: 25px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; }
        .btn-cancel { background-color: transparent; color: var(--text-sub); }
        .btn-submit { background-color: var(--accent); color: white; }
    </style>
</head>
<body>

    <h1>Life Cycles</h1>
    <div id="task-list">Loading tasks...</div>
    <button class="add-btn" id="open-modal">+</button>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div style="margin-bottom:20px; font-weight:700; font-size:18px;">New Task</div>
            <div class="form-group">
                <label>Task Name</label>
                <input type="text" id="task-name" placeholder="e.g. Change HVAC Filter">
            </div>
            <div class="form-group">
                <label>Repeats Every</label>
                <div class="interval-inputs">
                    <input type="number" id="task-interval-num" value="1" min="1" style="flex: 1;">
                    <select id="task-interval-unit" style="flex: 1.5;">
                        <option value="days">Days</option>
                        <option value="weeks">Weeks</option>
                        <option value="months">Months</option>
                        <option value="years" selected>Years</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Last Completed Date</label>
                <input type="date" id="task-date">
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="close-modal">Cancel</button>
                <button class="btn btn-submit" id="submit-task">Add Task</button>
            </div>
        </div>
    </div>

    <script>
        // REPLACE THESE TWO STRINGS WITH YOUR KEYS FROM JSONBIN
        const BIN_ID = '6a81d591f5f4af5e291d3532';
        const MASTER_KEY = '$2a$10$9ARHKeTmrEkoMWrFmawP5.TYxZEDkEJEzFWYcL5..gpywc6eaU.Hq';

        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        let tasks = [];

        // Helper: Convert interval value + unit to total milliseconds
        function getIntervalMs(value, unit) {
            const dayMs = 24 * 60 * 60 * 1000;
            switch(unit) {
                case 'days': return value * dayMs;
                case 'weeks': return value * 7 * dayMs;
                case 'months': return value * 30.4375 * dayMs;
                case 'years': return value * 365.25 * dayMs;
                default: return value * 365.25 * dayMs;
            }
        }

        async function loadTasksFromCloud() {
            try {
                const res = await fetch(`${API_URL}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await res.json();
                tasks = data.record || [];
                renderTasks();
            } catch (err) {
                document.getElementById('task-list').innerHTML = 'Error loading tasks.';
            }
        }

        async function saveTasksToCloud() {
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(tasks)
                });
            } catch (err) {
                alert('Failed to save to cloud.');
            }
        }

        function calculateTaskState(task) {
            const now = new Date();
            const dateParts = task.lastDone.split('-');
            const lastDone = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
            
            // Backwards compatibility for older items using intervalYears
            const val = task.intervalValue || task.intervalYears || 1;
            const unit = task.intervalUnit || 'years';

            const intervalMs = getIntervalMs(val, unit);
            const msSinceDone = now - lastDone;
            
            let percentRemaining = Math.max(0, Math.min(1, 1 - (msSinceDone / intervalMs)));
            
            let color = '#2ecc71'; // Green
            if (percentRemaining <= 0.15) color = '#f1c40f'; // Yellow
            if (percentRemaining <= 0.05) color = '#e74c3c'; // Red

            const daysRemaining = Math.ceil((intervalMs - msSinceDone) / (1000 * 60 * 60 * 24));
            
            let timeText = '';
            if (daysRemaining <= 0) {
                timeText = 'Overdue';
            } else if (daysRemaining === 1) {
                timeText = '1 day left';
            } else if (daysRemaining < 14) {
                timeText = `${daysRemaining} days left`;
            } else if (daysRemaining < 60) {
                timeText = `${Math.floor(daysRemaining / 7)} weeks left`;
            } else {
                timeText = `${Math.floor(daysRemaining / 30.44)} months left`;
            }

            // Capitalize unit string for badge
            const unitLabel = val === 1 ? unit.slice(0, -1) : unit;

            return {
                percentRemaining: percentRemaining * 100,
                color: color,
                timeText: timeText,
                lastDoneStr: lastDone.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }),
                cycleText: `${val} ${unitLabel}`
            };
        }

        function renderTasks() {
            const taskList = document.getElementById('task-list');
            taskList.innerHTML = '';

            if (tasks.length === 0) {
                taskList.innerHTML = '<div style="text-align:center; color: var(--text-sub); margin-top:40px;">No tasks yet. Tap + to add one.</div>';
                return;
            }

            const sortedTasks = [...tasks].sort((a, b) => calculateTaskState(a).percentRemaining - calculateTaskState(b).percentRemaining);

            sortedTasks.forEach(task => {
                const state = calculateTaskState(task);
                const card = document.createElement('div');
                card.className = 'task-card';
                card.innerHTML = `
                    <div class="task-header">
                        <h2 class="task-name">${task.name}</h2>
                        <span class="task-cycle">${state.cycleText}</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" id="fill-${task.id}" style="background-color: ${state.color}; width: ${state.percentRemaining}%;"></div>
                    </div>
                    <div class="task-details">
                        <span>Done: ${state.lastDoneStr}</span>
                        <span style="color: ${state.color === '#e74c3c' ? state.color : 'inherit'}">${state.timeText}</span>
                    </div>
                    <div class="button-group">
                        <button class="btn-complete" onclick="markComplete(${task.id})">Mark Complete Today</button>
                        <button class="btn-delete" onclick="deleteTask(${task.id})">Delete</button>
                    </div>
                `;
                taskList.appendChild(card);
            });
        }

        async function markComplete(id) {
            const taskIndex = tasks.findIndex(t => t.id === id);
            if (taskIndex !== -1) {
                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                
                tasks[taskIndex].lastDone = `${yyyy}-${mm}-${dd}`;
                
                const fillBar = document.getElementById(`fill-${id}`);
                if (fillBar) {
                    fillBar.style.width = '100%';
                    fillBar.style.backgroundColor = '#2ecc71';
                }

                setTimeout(async () => {
                    renderTasks();
                    await saveTasksToCloud();
                }, 300);
            }
        }

        async function deleteTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task && confirm(`Are you sure you want to delete "${task.name}"?`)) {
                tasks = tasks.filter(t => t.id !== id);
                renderTasks();
                await saveTasksToCloud();
            }
        }

        document.getElementById('open-modal').addEventListener('click', () => {
            document.getElementById('modal-overlay').style.display = 'flex';
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('task-date').value = `${yyyy}-${mm}-${dd}`;
        });

        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('modal-overlay').style.display = 'none';
        });

        document.getElementById('submit-task').addEventListener('click', async () => {
            const name = document.getElementById('task-name').value;
            const intervalVal = parseInt(document.getElementById('task-interval-num').value) || 1;
            const intervalUnit = document.getElementById('task-interval-unit').value;
            const date = document.getElementById('task-date').value;

            if (name && date) {
                tasks.push({ 
                    id: Date.now(), 
                    name: name, 
                    intervalValue: intervalVal, 
                    intervalUnit: intervalUnit, 
                    lastDone: date 
                });
                
                // Clear modal fields
                document.getElementById('task-name').value = '';
                document.getElementById('modal-overlay').style.display = 'none';
                
                renderTasks();
                await saveTasksToCloud();
            } else {
                alert('Please enter a task name and date.');
            }
        });

        loadTasksFromCloud();
    </script>
</body>
</html>
