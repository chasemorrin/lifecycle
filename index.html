<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life Cycles</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --accent: #2ecc71;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --border-radius: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-main: #e0e0e0;
                --text-sub: #a0a0a0;
                --accent: #27ae60;
                --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin: 30px 0 10px; font-weight: 700; font-size: 24px; }

        #task-list { width: 100%; max-width: 500px; display: grid; gap: 15px; padding-bottom: 80px; }

        .task-card {
            background-color: var(--card-bg);
            padding: 18px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .task-name { font-weight: 600; font-size: 17px; margin: 0; }
        .task-cycle { font-size: 12px; color: var(--text-sub); text-transform: uppercase; }

        .progress-bar-container {
            width: 100%; height: 12px; background-color: rgba(0,0,0,0.05);
            border-radius: 6px; overflow: hidden; margin-bottom: 15px;
        }
        @media (prefers-color-scheme: dark) {
            .progress-bar-container { background-color: rgba(255,255,255,0.05); }
        }

        .progress-bar-fill {
            height: 100%; border-radius: 6px; width: 0%;
            transition: width 0.8s ease-out, background-color 0.5s ease;
        }

        .task-details { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-sub); margin-bottom: 15px; }

        .btn-complete {
            width: 100%; padding: 12px; border: none; background-color: #f0f0f0;
            color: #333; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer;
        }
        @media (prefers-color-scheme: dark) {
            .btn-complete { background-color: #333; color: #e0e0e0; }
        }

        .add-btn {
            position: fixed; bottom: calc(30px + env(safe-area-inset-bottom)); right: 20px;
            width: 60px; height: 60px; background-color: var(--accent); color: white;
            border-radius: 30px; font-size: 30px; border: none;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.4); cursor: pointer;
            display: flex; align-items: center; justify-content: center; z-index: 10;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center;
            align-items: center; z-index: 100; padding: 20px;
        }

        .modal { background: var(--card-bg); padding: 25px; border-radius: var(--border-radius); width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--text-sub); }
        input[type="text"], input[type="date"], select {
            width: 100%; padding: 12px; border: 1px solid rgba(0,0,0,0.1);
            border-radius: 8px; background: var(--bg-color); color: var(--text-main); font-size: 16px;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 25px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; }
        .btn-cancel { background-color: transparent; color: var(--text-sub); }
        .btn-submit { background-color: var(--accent); color: white; }
    </style>
</head>
<body>

    <h1>Life Cycles</h1>
    <div id="task-list">Loading tasks...</div>
    <button class="add-btn" id="open-modal">+</button>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div style="margin-bottom:20px; font-weight:700; font-size:18px;">New Task</div>
            <div class="form-group">
                <label>Task Name</label>
                <input type="text" id="task-name" placeholder="Car Registration">
            </div>
            <div class="form-group">
                <label>Repeats Every</label>
                <select id="task-interval">
                    <option value="1">1 Year</option>
                    <option value="2">2 Years</option>
                    <option value="3">3 Years</option>
                    <option value="5">5 Years</option>
                    <option value="10">10 Years</option>
                </select>
            </div>
            <div class="form-group">
                <label>Last Completed Date</label>
                <input type="date" id="task-date">
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="close-modal">Cancel</button>
                <button class="btn btn-submit" id="submit-task">Add Task</button>
            </div>
        </div>
    </div>

    <script>
        // REPLACE THESE TWO STRINGS WITH YOUR KEYS FROM JSONBIN
        const BIN_ID = '6a81d591f5f4af5e291d3532';
        const MASTER_KEY = '$2a$10$9ARHKeTmrEkoMWrFmawP5.TYxZEDkEJEzFWYcL5..gpywc6eaU.Hq';

        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        let tasks = [];

        async function loadTasksFromCloud() {
            try {
                const res = await fetch(`${API_URL}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await res.json();
                tasks = data.record;
                renderTasks();
            } catch (err) {
                document.getElementById('task-list').innerHTML = 'Error loading tasks.';
            }
        }

        async function saveTasksToCloud() {
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(tasks)
                });
            } catch (err) {
                alert('Failed to save to cloud.');
            }
        }

        function calculateTaskState(task) {
            const now = new Date();
            const lastDone = new Date(task.lastDone);
            const intervalMs = task.intervalYears * 365.25 * 24 * 60 * 60 * 1000;
            const msSinceDone = now - lastDone;
            
            let percentRemaining = Math.max(0, Math.min(1, 1 - (msSinceDone / intervalMs)));
            
            let color = '#2ecc71';
            if (percentRemaining <= 0.15) color = '#f1c40f';
            if (percentRemaining <= 0.05) color = '#e74c3c';

            const daysRemaining = Math.ceil((intervalMs - msSinceDone) / (1000 * 60 * 60 * 24));
            let timeText = daysRemaining <= 0 ? 'Overdue' : (daysRemaining < 30 ? `${daysRemaining} days left` : `${Math.floor(daysRemaining / 30.44)} months left`);

            return {
                percentRemaining: percentRemaining * 100,
                color: color,
                timeText: timeText,
                lastDoneStr: lastDone.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })
            };
        }

        function renderTasks() {
            const taskList = document.getElementById('task-list');
            taskList.innerHTML = '';

            const sortedTasks = [...tasks].sort((a, b) => calculateTaskState(a).percentRemaining - calculateTaskState(b).percentRemaining);

            sortedTasks.forEach(task => {
                const state = calculateTaskState(task);
                const card = document.createElement('div');
                card.className = 'task-card';
                card.innerHTML = `
                    <div class="task-header">
                        <h2 class="task-name">${task.name}</h2>
                        <span class="task-cycle">${task.intervalYears} Year Cycle</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" style="background-color: ${state.color}; width: 0%;"></div>
                    </div>
                    <div class="task-details">
                        <span>Done: ${state.lastDoneStr}</span>
                        <span style="color: ${state.color === '#e74c3c' ? state.color : 'inherit'}">${state.timeText}</span>
                    </div>
                    <button class="btn-complete" onclick="markComplete(${task.id})">Mark Complete Today</button>
                `;
                taskList.appendChild(card);
                setTimeout(() => { card.querySelector('.progress-bar-fill').style.width = `${state.percentRemaining}%`; }, 100);
            });
        }

        async function markComplete(id) {
            const taskIndex = tasks.findIndex(t => t.id === id);
            if (taskIndex !== -1) {
                tasks[taskIndex].lastDone = new Date().toISOString().split('T')[0];
                renderTasks();
                await saveTasksToCloud();
            }
        }

        document.getElementById('open-modal').addEventListener('click', () => {
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('task-date').value = new Date().toISOString().split('T')[0];
        });

        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('modal-overlay').style.display = 'none';
        });

        document.getElementById('submit-task').addEventListener('click', async () => {
            const name = document.getElementById('task-name').value;
            const interval = parseInt(document.getElementById('task-interval').value);
            const date = document.getElementById('task-date').value;

            if (name && date) {
                tasks.push({ id: Date.now(), name, intervalYears: interval, lastDone: date });
                document.getElementById('modal-overlay').style.display = 'none';
                renderTasks();
                await saveTasksToCloud();
            }
        });

        loadTasksFromCloud();
    </script>
</body>
</html>
