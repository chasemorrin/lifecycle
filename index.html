<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upkeep — Maintenance Log</title>
<link rel="icon" type="image/png" href="upkeepfavicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="upkeepfavicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Upkeep">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1b1e1c;
    --panel: #23271f;
    --panel-edge: #2f342a;
    --ink: #e9e6da;
    --ink-dim: #9a9b8e;
    --green: #5fa777;
    --amber: #d99a3d;
    --red: #c1543f;
    --tick: #3a3f34;
  }

  *{ box-sizing: border-box; }

  /* iOS Safari zooms in on: (1) tapping inputs with font-size under 16px,
     and (2) double-taps on any element, since it can't tell a fast double-tap
     from a zoom gesture. touch-action: manipulation tells Safari to skip that
     double-tap-zoom check on interactive elements, and inputs are set to 16px below. */
  a, button, input, select, .task, .btn-done, .btn-del, .btn-add{
    touch-action: manipulation;
  }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, #232620 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    padding: 40px 16px 80px;
  }

  .wrap{ max-width: 720px; margin: 0 auto; }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom: 1px solid var(--panel-edge);
    padding-bottom: 18px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 8px;
  }

  h1{
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0;
  }
  h1 span{ color: var(--ink-dim); font-weight:500; }

  .status-line{
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 0.5px;
  }

  .hint{
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.3px;
    margin: -14px 0 20px;
  }

  /* ---- Add task panel ---- */
  .add-panel{
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 32px;
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-end;
  }
  .field{ display:flex; flex-direction:column; gap:4px; flex: 1 1 160px; }
  .field.small{ flex: 0 1 90px; }
  .field.unit{ flex: 0 1 110px; }
  label{
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  input, select{
    background: #191c16;
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    padding: 9px 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 16px;
  }
  input:focus, select:focus, button:focus{
    outline: 2px solid var(--amber);
    outline-offset: 1px;
  }
  button{
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    border: none;
    border-radius: 4px;
  }
  .btn-add{
    background: var(--green);
    color: #10140f;
    padding: 10px 18px;
    font-size: 14px;
    height: 38px;
  }
  .btn-add:hover{ filter: brightness(1.1); }

  .btn-adv{
    background: var(--panel-edge);
    color: var(--ink);
    width: 38px;
    height: 38px;
    font-size: 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform 0.2s ease, background 0.2s ease;
    flex: none;
  }
  .btn-adv:hover{ background: #333829; }
  .btn-adv.open{ transform: rotate(180deg); }

  .adv-panel{
    margin-top: -18px;
  }
  .adv-panel[hidden]{ display: none; }
  .adv-hint{
    flex: 1 1 100%;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.3px;
    margin-bottom: 2px;
  }

  /* ---- Task gauge card ---- */
  .task{
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .task-top{
    display:flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 10px;
  }
  .task-name{
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    display:flex;
    align-items:center;
    gap: 9px;
  }
  .dot{
    width: 9px; height: 9px; border-radius: 50%;
    box-shadow: 0 0 6px currentColor;
    flex: none;
  }
  .task-name-text{
    cursor: pointer;
    border-bottom: 1px dashed transparent;
  }
  .task-name-text:hover{ border-bottom-color: var(--ink-dim); }
  .task-name-input{
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--amber);
    color: var(--ink);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 0 0 2px;
  }
  .task-name-input:focus{ outline: none; }
  .task-actions{ display:flex; gap: 8px; align-items:center; }
  .btn-done{
    background: var(--panel-edge);
    color: var(--ink);
    padding: 7px 12px;
    font-size: 12px;
  }
  .btn-done:hover{ background: var(--green); color:#10140f; }
  .btn-del{
    background: transparent;
    color: var(--ink-dim);
    padding: 7px 8px;
    font-size: 12px;
  }
  .btn-del:hover{ color: var(--red); }

  .btn-link{
    background: transparent;
    color: var(--green);
    border: 1px solid var(--panel-edge);
    padding: 6px 11px;
    font-size: 12px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn-link:hover{ background: var(--green); color: #10140f; border-color: var(--green); }

  .gauge{
    position: relative;
    height: 20px;
    background: #14170f;
    border: 1px solid var(--tick);
    border-radius: 3px;
    overflow: hidden;
    cursor: ew-resize;
    touch-action: none;
  }
  .gauge.dragging{ filter: brightness(1.25); }
  .gauge-fill{
    height: 100%;
    width: 0%;
    position: relative;
    transition: width 0.6s ease;
  }
  .gauge-fill::after{
    content: "";
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 3px;
    background: rgba(233,230,218,0.6);
  }
  .gauge-ticks{
    position:absolute; inset:0;
    display:flex;
  }
  .gauge-ticks div{
    flex:1;
    border-right: 1px solid rgba(0,0,0,0.35);
  }
  .gauge-ticks div:last-child{ border-right:none; }

  .meta-row{
    display:flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.3px;
  }
  .meta-row .pct{ color: var(--ink); font-weight: 600; }

  .empty, .error{
    color: var(--ink-dim);
    font-size: 13px;
    padding: 24px 0;
    text-align: center;
  }
  .error{ color: var(--red); }

  @media (prefers-reduced-motion: reduce){
    .gauge-fill{ transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Upkeep <span>/ maintenance log</span></h1>
    <div class="status-line" id="statusLine">loading…</div>
  </header>

  <div class="hint">Tap a task's name to rename it · drag its bar to adjust time left</div>

  <div class="add-panel">
    <div class="field">
      <label for="nameInput">Task</label>
      <input id="nameInput" type="text" placeholder="e.g. Replace furnace filter">
    </div>
    <div class="field small">
      <label for="valueInput">Every</label>
      <input id="valueInput" type="number" min="1" value="1">
    </div>
    <div class="field unit">
      <label for="unitInput">Unit</label>
      <select id="unitInput">
        <option value="days">days</option>
        <option value="weeks">weeks</option>
        <option value="months" selected>months</option>
        <option value="years">years</option>
      </select>
    </div>
    <button class="btn-adv" id="advToggle" type="button" title="More options" aria-expanded="false">▾</button>
    <button class="btn-add" id="addBtn">Add task</button>
  </div>

  <div class="add-panel adv-panel" id="advPanel" hidden>
    <div class="adv-hint">Optional — set a different first due date, and/or attach a reference link</div>
    <div class="field small">
      <label for="firstValueInput">First due in</label>
      <input id="firstValueInput" type="number" min="1" placeholder="e.g. 2">
    </div>
    <div class="field unit">
      <label for="firstUnitInput">Unit</label>
      <select id="firstUnitInput">
        <option value="days">days</option>
        <option value="weeks" selected>weeks</option>
        <option value="months">months</option>
        <option value="years">years</option>
      </select>
    </div>
    <div class="field" style="flex:1 1 220px;">
      <label for="linkInput">Link</label>
      <input id="linkInput" type="url" placeholder="https://…">
    </div>
  </div>

  <div id="taskList"></div>

</div>

<script>
/* =========================================================
   CONFIG — fill these in with your own JSONBin values.
   Use a JSONBin "Access Key" scoped to ONLY this bin
   (Bin Settings → Access Keys), not your Master Key.
   Remember: this file runs in the browser, so this key
   is visible to anyone who views the page source — fine
   for non-sensitive personal data, not for secrets.
   ========================================================= */
const CONFIG = {
  BIN_ID: "6a81d591f5f4af5e291d3532",
  API_KEY: "$2a$10$9ARHKeTmrEkoMWrFmawP5.TYxZEDkEJEzFWYcL5..gpywc6eaU.Hq",
};

const API_BASE = `https://api.jsonbin.io/v3/b/${CONFIG.BIN_ID}`;

const UNIT_TO_DAYS = { days: 1, weeks: 7, months: 30, years: 365 };

let tasks = [];

const taskList = document.getElementById("taskList");
const statusLine = document.getElementById("statusLine");
const nameInput = document.getElementById("nameInput");
const valueInput = document.getElementById("valueInput");
const unitInput = document.getElementById("unitInput");
const addBtn = document.getElementById("addBtn");
const advToggle = document.getElementById("advToggle");
const advPanel = document.getElementById("advPanel");
const firstValueInput = document.getElementById("firstValueInput");
const firstUnitInput = document.getElementById("firstUnitInput");
const linkInput = document.getElementById("linkInput");

advToggle.addEventListener("click", () => {
  const willOpen = advPanel.hidden;
  advPanel.hidden = !willOpen;
  advToggle.classList.toggle("open", willOpen);
  advToggle.setAttribute("aria-expanded", String(willOpen));
});

function setStatus(msg, isError = false){
  statusLine.textContent = msg;
  statusLine.style.color = isError ? "var(--red)" : "var(--ink-dim)";
}

// Every task is normalized to an intervalDays number for math,
// even if it arrived from JSONBin with the older intervalYears field.
// This is the task's normal, ongoing recurrence.
function getNormalIntervalDays(task){
  if (typeof task.intervalDays === "number") return task.intervalDays;
  if (typeof task.intervalYears === "number") return Math.round(task.intervalYears * 365);
  return 365;
}

// Effective interval for countdown math: uses the one-time custom first-due
// duration while the task hasn't been marked done yet, then falls back to
// the normal recurring interval for every cycle after that.
function getIntervalDays(task){
  if (task.usingFirstInterval && typeof task.firstIntervalDays === "number"){
    return task.firstIntervalDays;
  }
  return getNormalIntervalDays(task);
}

function daysBetween(a, b){
  const msPerDay = 1000 * 60 * 60 * 24;
  return (b - a) / msPerDay;
}

function computeProgress(task){
  const intervalDays = getIntervalDays(task);
  const last = new Date(task.lastDone + "T00:00:00");
  const now = new Date();
  const elapsed = Math.max(0, daysBetween(last, now));
  const pct = Math.min(100, (elapsed / intervalDays) * 100);
  const daysLeft = Math.max(0, Math.ceil(intervalDays - elapsed));
  return { pct, daysLeft, intervalDays, overdue: elapsed >= intervalDays };
}

function statusColor(pct){
  if (pct >= 100) return "var(--red)";
  if (pct >= 75) return "var(--amber)";
  return "var(--green)";
}

function formatInterval(days){
  if (days % 365 === 0) return `${days / 365} yr`;
  if (days % 30 === 0) return `${days / 30} mo`;
  if (days % 7 === 0) return `${days / 7} wk`;
  return `${days} d`;
}

function render(){
  taskList.innerHTML = "";

  const validTasks = tasks.filter(t => t && typeof t === "object" && t.name);

  if (validTasks.length === 0){
    taskList.innerHTML = `<div class="empty">No tasks yet. Add one above to start tracking it.</div>`;
    return;
  }

  validTasks
    .slice()
    .sort((a, b) => computeProgress(b).pct - computeProgress(a).pct)
    .forEach(task => {
      const { pct, daysLeft, intervalDays, overdue } = computeProgress(task);
      const normalIntervalDays = getNormalIntervalDays(task);
      const color = statusColor(pct);
      const intervalLabel = task.usingFirstInterval
        ? `first due ${formatInterval(intervalDays)}, then every ${formatInterval(normalIntervalDays)}`
        : `every ${formatInterval(normalIntervalDays)}`;

      const card = document.createElement("div");
      card.className = "task";
      card.innerHTML = `
        <div class="task-top">
          <div class="task-name">
            <span class="dot" style="color:${color}; background:${color};"></span>
            <span class="task-name-text">${escapeHtml(task.name)}</span>
          </div>
          <div class="task-actions">
            ${task.link ? `<a class="btn-link" href="${escapeAttr(task.link)}" target="_blank" rel="noopener noreferrer" title="Open link">↗ Link</a>` : ""}
            <button class="btn-done" data-id="${task.id}">Mark done</button>
            <button class="btn-del" data-id="${task.id}" title="Delete task">✕</button>
          </div>
        </div>
        <div class="gauge">
          <div class="gauge-fill" style="width:${pct}%; background:${color};"></div>
          <div class="gauge-ticks">
            ${Array.from({length: 10}).map(() => "<div></div>").join("")}
          </div>
        </div>
        <div class="meta-row">
          <span>${intervalLabel} · last done ${task.lastDone}</span>
          <span class="pct">${overdue ? "DUE" : daysLeft + "d left"} · ${pct.toFixed(0)}%</span>
        </div>
      `;
      taskList.appendChild(card);
      attachNameEdit(card.querySelector(".task-name-text"), task);
      attachGaugeDrag(card.querySelector(".gauge"), task);
    });

  taskList.querySelectorAll(".btn-done").forEach(btn =>
    btn.addEventListener("click", () => markDone(btn.dataset.id))
  );
  taskList.querySelectorAll(".btn-del").forEach(btn =>
    btn.addEventListener("click", () => deleteTask(btn.dataset.id))
  );
}

// Click a task's name to rename it inline. Enter or blur commits, Escape cancels.
function attachNameEdit(span, task){
  span.addEventListener("click", () => {
    const input = document.createElement("input");
    input.type = "text";
    input.className = "task-name-input";
    input.value = task.name;
    span.replaceWith(input);
    input.focus();
    input.select();

    let settled = false;
    const commit = () => {
      if (settled) return;
      settled = true;
      const newName = input.value.trim();
      if (newName && newName !== task.name){
        task.name = newName;
        cacheTasks(tasks);
        saveTasks();
      }
      render();
    };
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter"){ input.blur(); }
      else if (e.key === "Escape"){ settled = true; render(); }
    });
  });
}

// Click-and-drag (or tap) anywhere on a task's gauge bar to set how much of
// its cycle has elapsed — drag left for more time left, right for less/overdue.
// Only lastDone is recalculated; the task's interval and first-cycle flag
// are untouched, so this never completes a cycle on its own.
function attachGaugeDrag(gaugeEl, task){
  const fillEl = gaugeEl.querySelector(".gauge-fill");
  const card = gaugeEl.closest(".task");
  const dotEl = card.querySelector(".dot");
  const pctEl = card.querySelector(".pct");
  let dragging = false;
  let pendingPct = null;

  function pctFromEvent(e){
    const rect = gaugeEl.getBoundingClientRect();
    const x = e.clientX - rect.left;
    return Math.min(100, Math.max(0, (x / rect.width) * 100));
  }

  function preview(pct){
    const color = statusColor(pct);
    fillEl.style.transition = "none";
    fillEl.style.width = pct + "%";
    fillEl.style.background = color;
    dotEl.style.background = color;
    dotEl.style.color = color;
    const intervalDays = getIntervalDays(task);
    const daysLeft = Math.max(0, Math.round(intervalDays - (intervalDays * pct / 100)));
    pctEl.textContent = `${pct >= 100 ? "DUE" : daysLeft + "d left"} · ${pct.toFixed(0)}%`;
  }

  function onDown(e){
    dragging = true;
    gaugeEl.classList.add("dragging");
    try{ gaugeEl.setPointerCapture(e.pointerId); } catch(err){}
    onMove(e);
  }
  function onMove(e){
    if (!dragging) return;
    e.preventDefault();
    pendingPct = pctFromEvent(e);
    preview(pendingPct);
  }
  function onUp(){
    if (!dragging) return;
    dragging = false;
    gaugeEl.classList.remove("dragging");
    if (pendingPct !== null) commitGaugeDrag(task, pendingPct);
    pendingPct = null;
  }

  gaugeEl.addEventListener("pointerdown", onDown);
  gaugeEl.addEventListener("pointermove", onMove);
  gaugeEl.addEventListener("pointerup", onUp);
  gaugeEl.addEventListener("pointercancel", onUp);
}

function commitGaugeDrag(task, pct){
  const intervalDays = getIntervalDays(task);
  const elapsedDays = Math.round(intervalDays * (pct / 100));
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - elapsedDays);
  task.lastDone = d.toISOString().slice(0, 10);
  render();
  cacheTasks(tasks);
  saveTasks();
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// Escapes a string for safe use inside an HTML attribute (quotes included).
function escapeAttr(str){
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// Normalizes a task link to a real http/https URL, or returns null if it
// can't be parsed as one. Assumes https:// if no scheme was typed, and
// refuses anything that isn't http/https (e.g. javascript:) as a safety net.
function safeLink(raw){
  let u = (raw || "").trim();
  if (!u) return null;
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)){
    u = "https://" + u;
  }
  try{
    const parsed = new URL(u);
    if (parsed.protocol === "http:" || parsed.protocol === "https:") return parsed.href;
  } catch(e){ /* falls through */ }
  return null;
}

function todayIso(){
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

/* ---- Local cache fallback (used when JSONBin is unreachable) ---- */
const CACHE_KEY = "upkeep_tasks_cache";
const CACHE_TS_KEY = "upkeep_tasks_cache_ts";

function cacheTasks(list){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify(list));
    localStorage.setItem(CACHE_TS_KEY, new Date().toISOString());
  } catch(e){
    console.warn("Couldn't write local cache", e);
  }
}

function readCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    const ts = localStorage.getItem(CACHE_TS_KEY);
    if (!raw) return null;
    return { tasks: JSON.parse(raw), ts };
  } catch(e){
    return null;
  }
}

function timeAgo(isoString){
  const diffMs = Date.now() - new Date(isoString).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.round(hrs / 24);
  return `${days}d ago`;
}

async function loadTasks(){
  setStatus("loading…");
  try{
    const res = await fetch(`${API_BASE}/latest`, {
      headers: { "X-Master-Key": CONFIG.API_KEY }
    });
    if (!res.ok) throw new Error(`JSONBin returned ${res.status}`);
    const data = await res.json();
    const raw = Array.isArray(data.record) ? data.record : [];
    const cleaned = raw.filter(t => t && typeof t === "object" && t.name);
    tasks = cleaned;
    cacheTasks(tasks);
    setStatus(`synced · ${tasks.length} task${tasks.length === 1 ? "" : "s"}`);
    render();
    if (cleaned.length !== raw.length){
      // Found and stripped bad entries (e.g. stray nulls) — push the clean version back.
      saveTasks();
    }
  } catch(err){
    console.error(err);
    const cached = readCache();
    if (cached){
      tasks = (cached.tasks || []).filter(t => t && typeof t === "object" && t.name);
      render();
      setStatus(`offline — showing cached data from ${timeAgo(cached.ts)}`, true);
    } else {
      setStatus("couldn't load from JSONBin — check BIN_ID / API_KEY", true);
      taskList.innerHTML = `<div class="error">Failed to load tasks, and no cached copy exists yet on this device. Open the console for details, and double-check CONFIG.BIN_ID and CONFIG.API_KEY at the top of the script.</div>`;
    }
  }
}

async function saveTasks(){
  setStatus("saving…");
  try{
    const res = await fetch(API_BASE, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": CONFIG.API_KEY
      },
      body: JSON.stringify(tasks)
    });
    if (!res.ok) throw new Error(`JSONBin returned ${res.status}`);
    cacheTasks(tasks);
    setStatus(`synced · ${tasks.length} task${tasks.length === 1 ? "" : "s"}`);
  } catch(err){
    console.error(err);
    cacheTasks(tasks); // keep the edit locally even though the sync failed
    setStatus("save failed — changes are shown locally but not synced", true);
  }
}

function markDone(id){
  const task = tasks.find(t => String(t.id) === String(id));
  if (!task) return;
  task.lastDone = todayIso();
  // The custom first-due duration only ever applies to the first cycle —
  // once it's been completed once, every future cycle uses the normal interval.
  if (task.usingFirstInterval) task.usingFirstInterval = false;
  render();
  cacheTasks(tasks);
  saveTasks();
}

function deleteTask(id){
  tasks = tasks.filter(t => String(t.id) !== String(id));
  render();
  cacheTasks(tasks);
  saveTasks();
}

function addTask(){
  const name = nameInput.value.trim();
  const value = parseFloat(valueInput.value);
  const unit = unitInput.value;

  if (!name){ nameInput.focus(); return; }
  if (!value || value <= 0){ valueInput.focus(); return; }

  const intervalDays = Math.round(value * UNIT_TO_DAYS[unit]);

  const task = {
    id: Date.now(),
    name,
    intervalDays,
    lastDone: todayIso()
  };

  const firstValue = parseFloat(firstValueInput.value);
  if (firstValue && firstValue > 0){
    task.firstIntervalDays = Math.round(firstValue * UNIT_TO_DAYS[firstUnitInput.value]);
    task.usingFirstInterval = true;
  }

  const link = safeLink(linkInput.value);
  if (link) task.link = link;

  tasks.push(task);

  nameInput.value = "";
  valueInput.value = "1";
  firstValueInput.value = "";
  linkInput.value = "";
  render();
  cacheTasks(tasks);
  saveTasks();
}

addBtn.addEventListener("click", addTask);
nameInput.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });
valueInput.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });

loadTasks();
</script>
</body>
