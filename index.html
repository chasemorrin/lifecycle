<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upkeep — Maintenance Log</title>
<link rel="icon" type="image/png" href="upkeepfavicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="upkeepfavicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Upkeep">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1b1e1c;
    --panel: #23271f;
    --panel-edge: #2f342a;
    --ink: #e9e6da;
    --ink-dim: #9a9b8e;
    --green: #5fa777;
    --amber: #d99a3d;
    --red: #c1543f;
    --tick: #3a3f34;
  }

  *{ box-sizing: border-box; }

  /* iOS Safari zooms in on: (1) tapping inputs with font-size under 16px,
     and (2) double-taps on any element, since it can't tell a fast double-tap
     from a zoom gesture. touch-action: manipulation tells Safari to skip that
     double-tap-zoom check on interactive elements, and inputs are set to 16px below. */
  a, button, input, select, .task, .btn-done, .btn-add{
    touch-action: manipulation;
  }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, #232620 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    padding: 40px 16px 80px;
  }

  .wrap{ max-width: 720px; margin: 0 auto; }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom: 1px solid var(--panel-edge);
    padding-bottom: 18px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 8px;
  }

  h1{
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0;
  }
  h1 span{ color: var(--ink-dim); font-weight:500; }

  .status-line{
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 0.5px;
  }

  .hint{
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.3px;
    margin: -14px 0 20px;
  }

  /* ---- Add task panel ---- */
  .add-panel{
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 32px;
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-end;
  }
  .field{ display:flex; flex-direction:column; gap:4px; flex: 1 1 160px; }
  .field.small{ flex: 0 1 90px; }
  .field.unit{ flex: 0 1 110px; }
  label{
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  input, select{
    background: #191c16;
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    padding: 9px 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 16px;
  }
  input:focus, select:focus, button:focus{
    outline: 2px solid var(--amber);
    outline-offset: 1px;
  }
  button{
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    border: none;
    border-radius: 4px;
  }
  .btn-add{
    background: var(--green);
    color: #10140f;
    padding: 10px 18px;
    font-size: 14px;
    height: 38px;
  }
  .btn-add:hover{ filter: brightness(1.1); }

  .btn-adv{
    background: var(--panel-edge);
    color: var(--ink);
    width: 38px;
    height: 38px;
    font-size: 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform 0.2s ease, background 0.2s ease;
    flex: none;
  }
  .btn-adv:hover{ background: #333829; }
  .btn-adv.open{ transform: rotate(180deg); }

  .adv-panel{
    margin-top: -18px;
  }
  .adv-panel[hidden]{ display: none; }
  .adv-hint{
    flex: 1 1 100%;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.3px;
    margin-bottom: 2px;
  }

  /* ---- Task type selector + date fields ---- */
  .type-row{
    flex: 1 1 100%;
    display: flex;
    gap: 6px;
  }
  .type-btn{
    flex: 1;
    background: #191c16;
    color: var(--ink-dim);
    border: 1px solid var(--panel-edge);
    padding: 9px 6px;
    font-size: 13px;
  }
  .type-btn.active{
    background: var(--green);
    color: #10140f;
    border-color: var(--green);
  }
  /* display:contents lets a group's fields join the parent's flex-wrap layout */
  .type-fields{ display: contents; }
  .type-fields[hidden]{ display: none; }
  input[type="date"]{
    color-scheme: dark;
    min-height: 40px;
    min-width: 0;
  }
  label.check{
    flex: 1 1 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 28px;
    font-size: 12px;
    letter-spacing: 0.3px;
    text-transform: none;
    color: var(--ink);
  }
  label.check input{
    width: 20px;
    height: 20px;
    padding: 0;
    flex: none;
    accent-color: var(--green);
  }
  /* Active date range: red-highlighted card for the whole window */
  .task.urgent{
    border-color: var(--red);
    background: #2b2420;
    box-shadow: 0 0 0 1px rgba(193,84,63,0.35), 0 0 14px rgba(193,84,63,0.12);
  }
  .task.urgent .meta-row .pct{ color: var(--red); }

  /* ---- Task gauge card ---- */
  .task{
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .task-top{
    display:flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 10px;
  }
  .task-name{
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    display:flex;
    align-items:center;
    gap: 9px;
  }
  .dot{
    width: 9px; height: 9px; border-radius: 50%;
    box-shadow: 0 0 6px currentColor;
    flex: none;
  }
  .task-name-text{ }
  .task-name-input{
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--amber);
    color: var(--ink);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 0 0 2px;
  }
  .task-name-input:focus{ outline: none; }
  .task-actions{ display:flex; gap: 8px; align-items:center; }
  .btn-done{
    background: var(--panel-edge);
    color: var(--ink);
    padding: 7px 12px;
    font-size: 12px;
  }
  .btn-done:hover{ background: var(--green); color:#10140f; }

  .btn-link{
    background: transparent;
    color: var(--green);
    border: 1px solid var(--panel-edge);
    width: 30px;
    height: 30px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    flex: none;
  }
  .btn-link:hover{ background: var(--green); color: #10140f; border-color: var(--green); }
  .btn-link svg{ flex: none; }

  .btn-edit{
    background: transparent;
    color: var(--ink-dim);
    padding: 7px 8px;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn-edit:hover{ color: var(--amber); }

  .task.editing{ border-color: var(--amber); }
  .edit-panel{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-end;
  }
  .edit-hint{
    flex: 1 1 100%;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.3px;
    margin-bottom: 2px;
  }
  .edit-actions{
    flex: 1 1 100%;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 4px;
  }
  .btn-cancel-edit{
    background: var(--panel-edge);
    color: var(--ink);
    padding: 9px 16px;
    font-size: 13px;
  }
  .btn-cancel-edit:hover{ background: #333829; }
  .btn-save-edit{
    background: var(--green);
    color: #10140f;
    padding: 9px 16px;
    font-size: 13px;
  }
  .btn-save-edit:hover{ filter: brightness(1.1); }

  .btn-delete-task{
    flex: 1 1 100%;
    background: var(--red);
    color: #1b0f0c;
    padding: 12px 16px;
    font-size: 14px;
    margin-top: 4px;
  }
  .btn-delete-task:hover{ filter: brightness(1.1); }

  .gauge{
    position: relative;
    height: 20px;
    background: #14170f;
    border: 1px solid var(--tick);
    border-radius: 3px;
    overflow: hidden;
  }
  .gauge-fill{
    height: 100%;
    width: 0%;
    transition: width 0.6s ease;
  }
  .gauge-ticks{
    position:absolute; inset:0;
    display:flex;
  }
  .gauge-ticks div{
    flex:1;
    border-right: 1px solid rgba(0,0,0,0.35);
  }
  .gauge-ticks div:last-child{ border-right:none; }

  .meta-row{
    display:flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.3px;
  }
  .meta-row .pct{ color: var(--ink); font-weight: 600; }

  .empty, .error{
    color: var(--ink-dim);
    font-size: 13px;
    padding: 24px 0;
    text-align: center;
  }
  .error{ color: var(--red); }

  @media (prefers-reduced-motion: reduce){
    .gauge-fill{ transition: none; }
  }
  /* Active date-range strip */
  .range-strip{
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 10px 12px 12px;
    margin: -14px 0 24px;
  }
  .range-strip[hidden]{ display:none; }
  .range-strip-title{
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--red); margin-bottom: 8px;
  }
  .range-items{ display:flex; gap:14px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .range-item{
    flex: 0 0 auto; width: 76px; background: none; border: 0; padding: 0;
    color: var(--ink); font: inherit; text-align: center; cursor: pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .range-item .rname{
    font-size: 11px; font-weight: 500; line-height: 1.2; max-width: 76px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; word-break:break-word;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Upkeep <span>/ maintenance log</span></h1>
    <div class="status-line" id="statusLine">loading…</div>
  </header>

  <div class="hint">Tap the pencil on a task to edit its name, schedule, or link</div>

  <div class="add-panel">
    <div class="type-row" id="typeRow">
      <button type="button" class="type-btn active" data-type="repeat">Repeats</button>
      <button type="button" class="type-btn" data-type="date">Due date</button>
      <button type="button" class="type-btn" data-type="range">Date range</button>
    </div>
    <div class="field">
      <label for="nameInput">Task</label>
      <input id="nameInput" type="text" placeholder="e.g. Replace furnace filter">
    </div>

    <div class="type-fields" id="fieldsRepeat">
      <div class="field small">
        <label for="valueInput">Every</label>
        <input id="valueInput" type="number" min="1" value="1">
      </div>
      <div class="field unit">
        <label for="unitInput">Unit</label>
        <select id="unitInput">
          <option value="days">days</option>
          <option value="weeks">weeks</option>
          <option value="months" selected>months</option>
          <option value="years">years</option>
        </select>
      </div>
    </div>

    <div class="type-fields" id="fieldsDate" hidden>
      <div class="field">
        <label for="dueDateInput">Due date</label>
        <input id="dueDateInput" type="date">
      </div>
      <label class="check"><input id="dateRepeat" type="checkbox"> Repeat yearly on this date (otherwise it's removed when done)</label>
    </div>

    <div class="type-fields" id="fieldsRange" hidden>
      <div class="field">
        <label for="rangeStartInput">Starts</label>
        <input id="rangeStartInput" type="date">
      </div>
      <div class="field">
        <label for="rangeEndInput">Ends</label>
        <input id="rangeEndInput" type="date">
      </div>
      <label class="check"><input id="rangeRepeat" type="checkbox"> Repeat yearly (otherwise it's removed when done)</label>
    </div>

    <button class="btn-adv" id="advToggle" type="button" title="More options" aria-expanded="false">▾</button>
    <button class="btn-add" id="addBtn">Add task</button>
  </div>

  <div class="add-panel adv-panel" id="advPanel" hidden>
    <div class="adv-hint" id="advHint">Optional — set a different first due date, and/or attach a reference link</div>
    <div class="type-fields" id="advFirstFields">
      <div class="field small">
        <label for="firstValueInput">First due in</label>
        <input id="firstValueInput" type="number" min="1" placeholder="e.g. 2">
      </div>
      <div class="field unit">
        <label for="firstUnitInput">Unit</label>
        <select id="firstUnitInput">
          <option value="days">days</option>
          <option value="weeks" selected>weeks</option>
          <option value="months">months</option>
          <option value="years">years</option>
        </select>
      </div>
    </div>
    <div class="field" style="flex:1 1 220px;">
      <label for="linkInput">Link</label>
      <input id="linkInput" type="url" placeholder="https://…">
    </div>
  </div>

  <div class="range-strip" id="rangeStrip" hidden>
    <div class="range-strip-title">Range tasks</div>
    <div class="range-items" id="rangeItems"></div>
  </div>

  <div id="taskList"></div>

</div>

<script>
/* =========================================================
   CONFIG — fill these in with your own JSONBin values.
   Use a JSONBin "Access Key" scoped to ONLY this bin
   (Bin Settings → Access Keys), not your Master Key.
   Remember: this file runs in the browser, so this key
   is visible to anyone who views the page source — fine
   for non-sensitive personal data, not for secrets.
   ========================================================= */
const CONFIG = {
  BIN_ID: "6a81d591f5f4af5e291d3532",
  API_KEY: "$2a$10$9ARHKeTmrEkoMWrFmawP5.TYxZEDkEJEzFWYcL5..gpywc6eaU.Hq",
};

const API_BASE = `https://api.jsonbin.io/v3/b/${CONFIG.BIN_ID}`;

const UNIT_TO_DAYS = { days: 1, weeks: 7, months: 30, years: 365 };

let tasks = [];
let editingTaskId = null;

const taskList = document.getElementById("taskList");
const statusLine = document.getElementById("statusLine");
const nameInput = document.getElementById("nameInput");
const valueInput = document.getElementById("valueInput");
const unitInput = document.getElementById("unitInput");
const addBtn = document.getElementById("addBtn");
const advToggle = document.getElementById("advToggle");
const advPanel = document.getElementById("advPanel");
const firstValueInput = document.getElementById("firstValueInput");
const firstUnitInput = document.getElementById("firstUnitInput");
const linkInput = document.getElementById("linkInput");
const fieldsRepeat = document.getElementById("fieldsRepeat");
const fieldsDate = document.getElementById("fieldsDate");
const fieldsRange = document.getElementById("fieldsRange");
const advFirstFields = document.getElementById("advFirstFields");
const advHint = document.getElementById("advHint");
const dueDateInput = document.getElementById("dueDateInput");
const dateRepeat = document.getElementById("dateRepeat");
const rangeStartInput = document.getElementById("rangeStartInput");
const rangeEndInput = document.getElementById("rangeEndInput");
const rangeRepeat = document.getElementById("rangeRepeat");

advToggle.addEventListener("click", () => {
  const willOpen = advPanel.hidden;
  advPanel.hidden = !willOpen;
  advToggle.classList.toggle("open", willOpen);
  advToggle.setAttribute("aria-expanded", String(willOpen));
});

// Which kind of task the add form is currently set up for:
// "repeat" (every N units), "date" (one specific due date) or "range" (start–end window).
let addType = "repeat";

function setAddType(type){
  addType = type;
  document.querySelectorAll(".type-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.type === type)
  );
  fieldsRepeat.hidden = type !== "repeat";
  fieldsDate.hidden = type !== "date";
  fieldsRange.hidden = type !== "range";
  // "First due in" only makes sense for repeating tasks.
  advFirstFields.hidden = type !== "repeat";
  advHint.textContent = type === "repeat"
    ? "Optional — set a different first due date, and/or attach a reference link"
    : "Optional — attach a reference link";
}

document.querySelectorAll(".type-btn").forEach(b =>
  b.addEventListener("click", () => setAddType(b.dataset.type))
);

function setStatus(msg, isError = false){
  statusLine.textContent = msg;
  statusLine.style.color = isError ? "var(--red)" : "var(--ink-dim)";
}

// Every task is normalized to an intervalDays number for math,
// even if it arrived from JSONBin with the older intervalYears field.
// This is the task's normal, ongoing recurrence.
function getNormalIntervalDays(task){
  if (typeof task.intervalDays === "number") return task.intervalDays;
  if (typeof task.intervalYears === "number") return Math.round(task.intervalYears * 365);
  return 365;
}

// Effective interval for countdown math: uses the one-time custom first-due
// duration while the task hasn't been marked done yet, then falls back to
// the normal recurring interval for every cycle after that.
function getIntervalDays(task){
  if (task.usingFirstInterval && typeof task.firstIntervalDays === "number"){
    return task.firstIntervalDays;
  }
  return getNormalIntervalDays(task);
}

function daysBetween(a, b){
  const msPerDay = 1000 * 60 * 60 * 24;
  return (b - a) / msPerDay;
}

const DAY_MS = 1000 * 60 * 60 * 24;

// Local-time calendar helpers. (toISOString() is UTC, which after ~7pm in the
// US already reports tomorrow's date — so dates are built from local parts.)
function localIso(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

// "YYYY-MM-DD" -> Date at local midnight, or null if missing/malformed.
function parseDay(s){
  if (typeof s !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  const d = new Date(s + "T00:00:00");
  return isNaN(d.getTime()) ? null : d;
}

function addYearsIso(iso, n){
  const d = parseDay(iso);
  if (!d) return iso;
  d.setFullYear(d.getFullYear() + n);
  return localIso(d);
}

// Short friendly date: "Apr 15", or "Apr 15, 2027" when it's not this year.
function fmtDay(iso){
  const d = parseDay(iso);
  if (!d) return iso || "?";
  const opts = { month: "short", day: "numeric" };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(undefined, opts);
}

// Every task gets a "due moment" (dueTs) so the list can be ordered by whichever
// is due first:
//   repeat -> last done + its interval        date  -> the due date
//   range  -> the range's first day while it's still ahead (phase 1: a normal bar
//             filling from when it was added up to that first day), then the
//             range's last day once inside it (phase 2: a red bar filling 0->100%
//             across the range, flagged urgent).
function computeProgress(task){
  const type = task.type || "repeat";
  const now = new Date();
  // Corrupted entry: inert, sorted last, never NaN.
  const inert = { pct: 0, rawPct: 0, dueTs: Infinity, daysLeft: 0, intervalDays: 0,
                  overdue: false, urgent: false, preRange: false, startsInDays: 0 };

  if (type === "date"){
    const end = parseDay(task.dueDate);
    if (!end) return inert;
    const start = parseDay(task.startDate) || new Date(end.getTime() - 365 * DAY_MS);
    const spanDays = Math.max(0, (end - start) / DAY_MS);
    const elapsed = (now - start) / DAY_MS;
    const rawPct = spanDays > 0 ? (Math.max(0, elapsed) / spanDays) * 100 : 100;
    return {
      pct: Math.min(100, rawPct), rawPct, dueTs: end.getTime(),
      daysLeft: Math.max(0, Math.ceil((end - now) / DAY_MS)),
      intervalDays: Math.round(spanDays), overdue: now >= end,
      urgent: false, preRange: false, startsInDays: 0
    };
  }

  if (type === "range"){
    const rs = parseDay(task.rangeStart);
    const re = parseDay(task.rangeEnd);
    if (!rs || !re) return inert;

    if (now < rs){
      // Phase 1: ordinary bar, added-date -> first day of the range.
      const start = parseDay(task.startDate) || new Date(rs.getTime() - 365 * DAY_MS);
      const spanDays = Math.max(0, (rs - start) / DAY_MS);
      const elapsed = (now - start) / DAY_MS;
      const rawPct = spanDays > 0 ? (Math.max(0, elapsed) / spanDays) * 100 : 100;
      const startsInDays = Math.ceil((rs - now) / DAY_MS);
      return {
        pct: Math.min(100, rawPct), rawPct, dueTs: rs.getTime(),
        daysLeft: startsInDays, intervalDays: Math.round(spanDays), overdue: false,
        urgent: false, preRange: true, startsInDays
      };
    }

    // Phase 2: inside the range (and after it, until marked Done): red, 0 -> 100%.
    const spanDays = Math.max(0, (re - rs) / DAY_MS);
    const elapsed = (now - rs) / DAY_MS;
    const rawPct = spanDays > 0 ? (elapsed / spanDays) * 100 : 100;
    return {
      pct: Math.min(100, rawPct), rawPct, dueTs: re.getTime(),
      daysLeft: Math.max(0, Math.ceil((re - now) / DAY_MS)),
      intervalDays: Math.round(spanDays), overdue: now >= re,
      urgent: true, preRange: false, startsInDays: 0
    };
  }

  /* ---- Normal repeating task ---- */
  const intervalDays = getIntervalDays(task);
  const last = new Date(task.lastDone + "T00:00:00");
  // Guard against a task with a missing/malformed lastDone (e.g. corrupted
  // or hand-edited data) — without this, elapsed becomes NaN, which breaks
  // the sort comparator and can silently knock a genuinely overdue task out
  // of its rightful spot at the top of the list.
  const validLast = !isNaN(last.getTime());
  const elapsed = validLast ? Math.max(0, daysBetween(last, now)) : 0;
  // rawPct is uncapped (pct is capped at 100 for the bar and the "%" on screen).
  const rawPct = (elapsed / intervalDays) * 100;
  const pct = Math.min(100, rawPct);
  const daysLeft = Math.max(0, Math.ceil(intervalDays - elapsed));
  // Calendar-day arithmetic (not +N*24h), so a task that crosses a daylight-saving
  // change still falls on the right date.
  const dueBase = new Date(validLast ? last.getTime() : now.getTime());
  dueBase.setDate(dueBase.getDate() + intervalDays);
  const dueTs = dueBase.getTime();
  return { pct, rawPct, dueTs, daysLeft, intervalDays, overdue: elapsed >= intervalDays,
           urgent: false, preRange: false, startsInDays: 0 };
}

// Earliest due first (so the most overdue task is on top). Ties: further along first.
// Written with explicit comparisons because Infinity - Infinity is NaN.
function compareDue(a, b){
  if (a.dueTs !== b.dueTs) return a.dueTs < b.dueTs ? -1 : 1;
  return b.pct - a.pct;
}

function statusColor(pct){
  if (pct >= 100) return "var(--red)";
  if (pct >= 75) return "var(--amber)";
  return "var(--green)";
}

function formatInterval(days){
  if (days % 365 === 0) return `${days / 365} yr`;
  if (days % 30 === 0) return `${days / 30} mo`;
  if (days % 7 === 0) return `${days / 7} wk`;
  return `${days} d`;
}

// The inverse of value*UNIT_TO_DAYS[unit] — picks the largest whole unit
// that divides evenly into the given day count, so edit-form fields show
// "2 weeks" instead of "14 days" when that's how it was originally entered.
function daysToValueUnit(days){
  if (days > 0 && days % 365 === 0) return { value: days / 365, unit: "years" };
  if (days > 0 && days % 30 === 0) return { value: days / 30, unit: "months" };
  if (days > 0 && days % 7 === 0) return { value: days / 7, unit: "weeks" };
  return { value: days, unit: "days" };
}

function ringSvg(pct, size, text){
  const sw = 5, r = (size - sw) / 2, c = size / 2, circ = 2 * Math.PI * r;
  const frac = Math.max(0, Math.min(1, pct / 100));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#3a3f34" stroke-width="${sw}"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#c1543f" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${(circ * frac).toFixed(2)} ${circ.toFixed(2)}" transform="rotate(-90 ${c} ${c})"/>
    <text x="${c}" y="${c}" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#e9e6da">${escapeHtml(text)}</text>
  </svg>`;
}

function renderRangeStrip(list){
  const strip = document.getElementById("rangeStrip");
  const box = document.getElementById("rangeItems");
  const active = list
    .map(t => ({ t, p: computeProgress(t) }))
    .filter(x => x.p.urgent)
    .sort((a, b) => compareDue(a.p, b.p));
  box.innerHTML = "";
  strip.hidden = active.length === 0;
  active.forEach(({ t, p }) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "range-item";
    b.innerHTML = `<span class="rname">${escapeHtml(t.name)}</span>${ringSvg(p.pct, 46, p.overdue ? "DUE" : p.daysLeft + "d")}`;
    b.addEventListener("click", () => {
      const cards = Array.from(taskList.children);
      const el = cards.find(c => c.dataset && c.dataset.taskId === String(t.id));
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    box.appendChild(b);
  });
}

function render(){
  taskList.innerHTML = "";

  const validTasks = tasks.filter(t => t && typeof t === "object" && t.name);
  renderRangeStrip(validTasks);

  if (validTasks.length === 0){
    taskList.innerHTML = `<div class="empty">No tasks yet. Add one above to start tracking it.</div>`;
    return;
  }

  validTasks
    .slice()
    .sort((a, b) => compareDue(computeProgress(a), computeProgress(b)))
    .forEach(task => {
      const { pct, daysLeft, intervalDays, overdue, preRange, startsInDays, urgent } = computeProgress(task);
      const type = task.type || "repeat";
      const normalIntervalDays = getNormalIntervalDays(task);
      const color = urgent ? "var(--red)" : statusColor(pct);
      const repeatNote = task.repeatYearly ? "repeats yearly" : "one-time";
      let scheduleLabel;
      if (type === "date"){
        scheduleLabel = `due ${fmtDay(task.dueDate)} · ${repeatNote}`;
      } else if (type === "range"){
        scheduleLabel = `${fmtDay(task.rangeStart)} – ${fmtDay(task.rangeEnd)} · ${repeatNote}`;
      } else {
        const intervalLabel = task.usingFirstInterval
          ? `first due ${formatInterval(intervalDays)}, then every ${formatInterval(normalIntervalDays)}`
          : `every ${formatInterval(normalIntervalDays)}`;
        scheduleLabel = `${intervalLabel} · last done ${task.lastDone}`;
      }
      const statusLabel = preRange
        ? `starts in ${startsInDays}d · ${pct.toFixed(0)}%`
        : `${overdue ? "DUE" : daysLeft + "d left"} · ${pct.toFixed(0)}%`;

      const card = document.createElement("div");
      card.dataset.taskId = String(task.id);

      if (String(task.id) === String(editingTaskId)){
        card.className = "task editing";
        card.innerHTML = buildEditFormHtml(task);
        taskList.appendChild(card);
        wireEditForm(card, task);
        return;
      }

      card.className = urgent ? "task urgent" : "task";
      card.innerHTML = `
        <div class="task-top">
          <div class="task-name">
            <span class="dot" style="color:${color}; background:${color};"></span>
            <span class="task-name-text">${escapeHtml(task.name)}</span>
          </div>
          <div class="task-actions">
            ${task.link ? `<a class="btn-link" href="${escapeAttr(task.link)}" target="_blank" rel="noopener noreferrer" title="Open link"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg></a>` : ""}
            <button class="btn-edit" data-id="${task.id}" title="Edit task"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></button>
            <button class="btn-done" data-id="${task.id}">Done</button>
          </div>
        </div>
        <div class="gauge">
          <div class="gauge-fill" style="width:${pct}%; background:${color};"></div>
          <div class="gauge-ticks">
            ${Array.from({length: 10}).map(() => "<div></div>").join("")}
          </div>
        </div>
        <div class="meta-row">
          <span>${scheduleLabel}</span>
          <span class="pct">${statusLabel}</span>
        </div>
      `;
      taskList.appendChild(card);
    });

  taskList.querySelectorAll(".btn-done").forEach(btn =>
    btn.addEventListener("click", () => markDone(btn.dataset.id))
  );
  taskList.querySelectorAll(".btn-edit").forEach(btn =>
    btn.addEventListener("click", () => { editingTaskId = btn.dataset.id; render(); })
  );
}

// Builds the inline edit form shown in place of a task card while it's being edited.
// The schedule fields depend on the task's type; name and link are common to all.
function buildEditFormHtml(task){
  const type = task.type || "repeat";
  const unitOptions = (selected) => ["days", "weeks", "months", "years"]
    .map(u => `<option value="${u}"${u === selected ? " selected" : ""}>${u}</option>`)
    .join("");

  let scheduleFields;
  if (type === "date"){
    scheduleFields = `
      <div class="field">
        <label>Due date</label>
        <input type="date" class="edit-date" value="${escapeAttr(task.dueDate || "")}">
      </div>
      <label class="check"><input type="checkbox" class="edit-repeat"${task.repeatYearly ? " checked" : ""}> Repeat yearly on this date (otherwise it's removed when done)</label>
    `;
  } else if (type === "range"){
    scheduleFields = `
      <div class="field">
        <label>Starts</label>
        <input type="date" class="edit-range-start" value="${escapeAttr(task.rangeStart || "")}">
      </div>
      <div class="field">
        <label>Ends</label>
        <input type="date" class="edit-range-end" value="${escapeAttr(task.rangeEnd || "")}">
      </div>
      <label class="check"><input type="checkbox" class="edit-repeat"${task.repeatYearly ? " checked" : ""}> Repeat yearly (otherwise it's removed when done)</label>
    `;
  } else {
    const everyVU = daysToValueUnit(getNormalIntervalDays(task));
    const dueVU = daysToValueUnit(computeProgress(task).daysLeft);
    scheduleFields = `
      <div class="field small">
        <label>Repeats every</label>
        <input type="number" min="1" class="edit-every-value" value="${everyVU.value}">
      </div>
      <div class="field unit">
        <label>Unit</label>
        <select class="edit-every-unit">${unitOptions(everyVU.unit)}</select>
      </div>
      <div class="field small">
        <label>Due in</label>
        <input type="number" min="0" class="edit-due-value" value="${dueVU.value}">
      </div>
      <div class="field unit">
        <label>Unit</label>
        <select class="edit-due-unit">${unitOptions(dueVU.unit)}</select>
      </div>
    `;
  }

  return `
    <div class="edit-panel">
      <div class="edit-hint">Editing task</div>
      <div class="field" style="flex:1 1 100%;">
        <label>Task</label>
        <input type="text" class="task-name-input edit-name" value="${escapeAttr(task.name)}">
      </div>
      ${scheduleFields}
      <div class="field" style="flex:1 1 220px;">
        <label>Link</label>
        <input type="url" class="edit-link" placeholder="https://…" value="${escapeAttr(task.link || "")}">
      </div>
      <div class="edit-actions">
        <button type="button" class="btn-cancel-edit">Cancel</button>
        <button type="button" class="btn-save-edit">Save</button>
      </div>
      <button type="button" class="btn-delete-task">Delete task</button>
    </div>
  `;
}

// Wires up Save/Cancel/Delete for a task's edit form. Nothing in `tasks` is touched
// until Save is pressed and every field has validated — Cancel just closes the form.
function wireEditForm(card, task){
  const type = task.type || "repeat";
  const q = sel => card.querySelector(sel);
  const nameEl = q(".edit-name");
  const linkEl = q(".edit-link");

  q(".btn-cancel-edit").addEventListener("click", () => {
    editingTaskId = null;
    render();
  });

  q(".btn-delete-task").addEventListener("click", () => {
    if (!confirm(`Delete "${task.name}"? This can't be undone.`)) return;
    editingTaskId = null;
    deleteTask(task.id);
  });

  q(".btn-save-edit").addEventListener("click", () => {
    const newName = nameEl.value.trim();
    if (!newName){ nameEl.focus(); return; }

    // ---- Validate the schedule fields for this task's type (no changes yet) ----
    let apply;   // closure that commits the schedule change once everything is valid

    if (type === "date"){
      const dueEl = q(".edit-date");
      const due = parseDay(dueEl.value);
      if (!due){ dueEl.focus(); return; }
      const repeat = q(".edit-repeat").checked;
      apply = () => {
        const start = parseDay(task.startDate);
        // If the new due date isn't after the old start, restart the countdown from today.
        if (!start || due <= start) task.startDate = todayIso();
        task.dueDate = dueEl.value;
        task.repeatYearly = repeat;
      };
    } else if (type === "range"){
      const startEl = q(".edit-range-start");
      const endEl = q(".edit-range-end");
      const s = parseDay(startEl.value);
      const e = parseDay(endEl.value);
      if (!s){ startEl.focus(); return; }
      if (!e){ endEl.focus(); return; }
      if (e < s){
        setStatus("end date must be on or after the start date", true);
        endEl.focus();
        return;
      }
      const repeat = q(".edit-repeat").checked;
      apply = () => {
        const added = parseDay(task.startDate);
        // If the new first day isn't after when it was added, restart the phase-1 bar from today.
        if (!added || s <= added) task.startDate = todayIso();
        task.rangeStart = startEl.value;
        task.rangeEnd = endEl.value;
        task.repeatYearly = repeat;
      };
    } else {
      const everyValueEl = q(".edit-every-value");
      const everyUnitEl = q(".edit-every-unit");
      const dueValueEl = q(".edit-due-value");
      const dueUnitEl = q(".edit-due-unit");

      const everyValue = parseFloat(everyValueEl.value);
      if (!everyValue || everyValue <= 0){ everyValueEl.focus(); return; }

      const dueValueRaw = parseFloat(dueValueEl.value);
      const dueValue = isNaN(dueValueRaw) ? 0 : Math.max(0, dueValueRaw);

      apply = () => {
        task.intervalDays = Math.round(everyValue * UNIT_TO_DAYS[everyUnitEl.value]);
        delete task.intervalYears;

        // Recompute lastDone so "due in" matches what was entered, measured
        // against whichever interval now governs the task's current cycle
        // (the first-due override, if it's still active, otherwise the normal
        // cycle we just saved above).
        const dueDays = Math.round(dueValue * UNIT_TO_DAYS[dueUnitEl.value]);
        const effectiveIntervalDays = getIntervalDays(task);
        const elapsedDays = Math.max(0, effectiveIntervalDays - dueDays);
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        d.setDate(d.getDate() - elapsedDays);
        task.lastDone = localIso(d);
      };
    }

    // ---- Everything validated: commit ----
    task.name = newName;
    apply();

    const link = safeLink(linkEl.value);
    if (link) task.link = link;
    else if (!linkEl.value.trim()) delete task.link;

    editingTaskId = null;
    render();
    cacheTasks(tasks);
    saveTasks();
  });

  card.addEventListener("keydown", e => {
    if (e.key === "Escape"){ editingTaskId = null; render(); }
  });
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// Escapes a string for safe use inside an HTML attribute (quotes included).
function escapeAttr(str){
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// Normalizes a task link to a real http/https URL, or returns null if it
// can't be parsed as one. Assumes https:// if no scheme was typed, and
// refuses anything that isn't http/https (e.g. javascript:) as a safety net.
function safeLink(raw){
  let u = (raw || "").trim();
  if (!u) return null;
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)){
    u = "https://" + u;
  }
  try{
    const parsed = new URL(u);
    if (parsed.protocol === "http:" || parsed.protocol === "https:") return parsed.href;
  } catch(e){ /* falls through */ }
  return null;
}

function todayIso(){
  return localIso(new Date());
}

/* ---- Local cache fallback (used when JSONBin is unreachable) ---- */
const CACHE_KEY = "upkeep_tasks_cache";
const CACHE_TS_KEY = "upkeep_tasks_cache_ts";

function cacheTasks(list){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify(list));
    localStorage.setItem(CACHE_TS_KEY, new Date().toISOString());
  } catch(e){
    console.warn("Couldn't write local cache", e);
  }
}

function readCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    const ts = localStorage.getItem(CACHE_TS_KEY);
    if (!raw) return null;
    return { tasks: JSON.parse(raw), ts };
  } catch(e){
    return null;
  }
}

function timeAgo(isoString){
  const diffMs = Date.now() - new Date(isoString).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.round(hrs / 24);
  return `${days}d ago`;
}

async function loadTasks(){
  setStatus("loading…");
  try{
    const res = await fetch(`${API_BASE}/latest`, {
      headers: { "X-Master-Key": CONFIG.API_KEY }
    });
    if (!res.ok) throw new Error(`JSONBin returned ${res.status}`);
    const data = await res.json();
    const raw = Array.isArray(data.record) ? data.record : [];
    const cleaned = raw.filter(t => t && typeof t === "object" && t.name);
    tasks = cleaned;
    cacheTasks(tasks);
    setStatus(`synced · ${tasks.length} task${tasks.length === 1 ? "" : "s"}`);
    render();
    if (cleaned.length !== raw.length){
      // Found and stripped bad entries (e.g. stray nulls) — push the clean version back.
      saveTasks();
    }
  } catch(err){
    console.error(err);
    const cached = readCache();
    if (cached){
      tasks = (cached.tasks || []).filter(t => t && typeof t === "object" && t.name);
      render();
      setStatus(`offline — showing cached data from ${timeAgo(cached.ts)}`, true);
    } else {
      setStatus("couldn't load from JSONBin — check BIN_ID / API_KEY", true);
      taskList.innerHTML = `<div class="error">Failed to load tasks, and no cached copy exists yet on this device. Open the console for details, and double-check CONFIG.BIN_ID and CONFIG.API_KEY at the top of the script.</div>`;
    }
  }
}

async function saveTasks(){
  setStatus("saving…");
  try{
    const res = await fetch(API_BASE, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": CONFIG.API_KEY
      },
      body: JSON.stringify(tasks)
    });
    if (!res.ok) throw new Error(`JSONBin returned ${res.status}`);
    cacheTasks(tasks);
    setStatus(`synced · ${tasks.length} task${tasks.length === 1 ? "" : "s"}`);
  } catch(err){
    console.error(err);
    cacheTasks(tasks); // keep the edit locally even though the sync failed
    setStatus("save failed — changes are shown locally but not synced", true);
  }
}

// Moves a yearly-repeating date/range task to its next occurrence.
function rollForwardYearly(task){
  const today = parseDay(todayIso());
  if (task.type === "range"){
    if (!parseDay(task.rangeStart) || !parseDay(task.rangeEnd)) return;
    let s = task.rangeStart, e = task.rangeEnd;
    // Always advance at least one year, and keep going if the range is somehow still in the past.
    for (let i = 0; i < 200; i++){
      s = addYearsIso(s, 1);
      e = addYearsIso(e, 1);
      if (parseDay(e) >= today) break;
    }
    task.rangeStart = s;
    task.rangeEnd = e;
    task.startDate = todayIso();   // next year's phase-1 bar starts filling from today
  } else {
    if (!parseDay(task.dueDate)) return;
    let due = task.dueDate;
    for (let i = 0; i < 200; i++){
      due = addYearsIso(due, 1);
      if (parseDay(due) > today) break;
    }
    task.dueDate = due;
    task.startDate = todayIso();   // next cycle's bar starts filling from today
  }
}

function markDone(id){
  const task = tasks.find(t => String(t.id) === String(id));
  if (!task) return;
  const type = task.type || "repeat";

  if (type === "repeat"){
    task.lastDone = todayIso();
    // The custom first-due duration only ever applies to the first cycle —
    // once it's been completed once, every future cycle uses the normal interval.
    if (task.usingFirstInterval) task.usingFirstInterval = false;
  } else if (task.repeatYearly){
    rollForwardYearly(task);
  } else {
    // One-time date/range task: finishing it removes it.
    if (!confirm(`Mark "${task.name}" done? One-time tasks are removed when completed.`)) return;
    tasks = tasks.filter(t => t !== task);
  }

  render();
  cacheTasks(tasks);
  saveTasks();
}

function deleteTask(id){
  tasks = tasks.filter(t => String(t.id) !== String(id));
  render();
  cacheTasks(tasks);
  saveTasks();
}

function addTask(){
  const name = nameInput.value.trim();
  if (!name){ nameInput.focus(); return; }

  const task = { id: Date.now(), name };

  if (addType === "date"){
    if (!parseDay(dueDateInput.value)){ dueDateInput.focus(); return; }
    task.type = "date";
    task.dueDate = dueDateInput.value;
    task.startDate = todayIso();          // bar fills from today up to the due date
    task.repeatYearly = dateRepeat.checked;
  } else if (addType === "range"){
    const s = parseDay(rangeStartInput.value);
    const e = parseDay(rangeEndInput.value);
    if (!s){ rangeStartInput.focus(); return; }
    if (!e){ rangeEndInput.focus(); return; }
    if (e < s){
      setStatus("end date must be on or after the start date", true);
      rangeEndInput.focus();
      return;
    }
    task.type = "range";
    task.startDate = todayIso();          // phase-1 bar fills from today up to the range's first day
    task.rangeStart = rangeStartInput.value;
    task.rangeEnd = rangeEndInput.value;
    task.repeatYearly = rangeRepeat.checked;
  } else {
    const value = parseFloat(valueInput.value);
    if (!value || value <= 0){ valueInput.focus(); return; }
    task.intervalDays = Math.round(value * UNIT_TO_DAYS[unitInput.value]);
    task.lastDone = todayIso();

    const firstValue = parseFloat(firstValueInput.value);
    if (firstValue && firstValue > 0){
      task.firstIntervalDays = Math.round(firstValue * UNIT_TO_DAYS[firstUnitInput.value]);
      task.usingFirstInterval = true;
    }
  }

  const link = safeLink(linkInput.value);
  if (link) task.link = link;

  tasks.push(task);

  nameInput.value = "";
  valueInput.value = "1";
  firstValueInput.value = "";
  linkInput.value = "";
  dueDateInput.value = "";
  dateRepeat.checked = false;
  rangeStartInput.value = "";
  rangeEndInput.value = "";
  rangeRepeat.checked = false;
  render();
  cacheTasks(tasks);
  saveTasks();
}

addBtn.addEventListener("click", addTask);
nameInput.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });
valueInput.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });

loadTasks();
</script>
</body>
